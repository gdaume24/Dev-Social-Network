name: full_stack_project_oc
services:
  dsn_db:
    container_name: dsn_db
    image: mysql:8.4.3
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: network
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    restart: unless-stopped
    env_file:
      - path: .env
    networks:
      - spring-demo
  dsn_api:
    container_name: dsn_api
    build:
      context: ./back
      dockerfile: ../docker/backend/Dockerfile
    image: dsn/dsn:1.0.0
    ports:
      - 8088:8088
    networks:
      - spring-demo
    depends_on:
      - dsn_db


networks:
  spring-demo:
    driver: bridge
