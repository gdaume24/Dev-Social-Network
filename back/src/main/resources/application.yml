# application.yml
spring:
  application:
    name: Dev Social Network
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  mvc:
    servlet:
      path: /api

jwt:
  secret: ${SECURITY_JWT_SECRET_KEY}
  expiration-time: ${SECURITY_JWT_EXPIRATION_TIME}

logging:
  level:
    org:
      springframework:
        security: TRACE
        web: TRACE
        springframework: DEBUG
        hibernate: DEBUG
      apache:
        tomcat: DEBUG

server:
  port: 8088